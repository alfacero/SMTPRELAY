; -------------------------------------------------------------------
;  relay.ini - Configuración del servicio Relay SMTP Local
; -------------------------------------------------------------------
;  Colocá este archivo en la misma carpeta que relay.exe.
;  Todas las rutas vacías se resuelven al directorio del ejecutable.
; -------------------------------------------------------------------

[Servidor]
; Puerto donde el relay escucha a las fuentes locales (SMTP entrante).
; El puerto 25 suele requerir privilegios de administrador.
; El 2525 es la alternativa segura y no requiere permisos especiales.
PuertoLocal=2525

; Tamaño máximo aceptado por mensaje, en kilobytes.
; 25600 = 25 MB. Si una fuente envía algo más grande, se rechaza.
MaxMessageSizeKB=25600


[Destino]
; Servidor SMTP al que se reenvían los correos.
Servidor=smtp.gmail.com
Puerto=587

; Credenciales de autenticación (si UsarAuth=True).
Usuario=pablohar@gmail.com
Password=kleimlhsxtlvvdcu

; Autenticación SMTP (AUTH LOGIN / PLAIN). Dejalo en False si el
; servidor destino acepta relay sin credenciales (raro fuera de LAN).
UsarAuth=1

; Cifrado TLS para la conexión saliente.
;   False            -> sin cifrado (solo para servidores internos)
;   True + explicit  -> STARTTLS en el puerto 587 (lo más común hoy)
;   True + implicit  -> TLS directo en el puerto 465
UsarTLS=1
TipoTLS=explicit


[Cola]
; Cada cuántos milisegundos revisa el worker si hay correos pendientes.
; 5000 = 5 segundos. No conviene bajarlo mucho más: el servidor destino
; puede interpretarlo como abuso.
IntervaloWorkerMs=5000

; Cantidad máxima de intentos antes de marcar un correo como fallido
; definitivo. Después de esto ya no se reintenta solo.
MaxIntentos=10

; Días máximos que un correo puede permanecer en la cola reintentándose.
; Pasado este plazo, se marca como fallido definitivo aunque no haya
; llegado a MaxIntentos.
DiasMaxReintento=5


[Archivos]
; Ruta de la base SQLite con la cola de correos.
; Vacío = <carpeta del exe>\cola.db
; Si el servicio corre como LocalSystem, usá una ruta absoluta accesible,
; por ejemplo: C:\RelaySMTP\data\cola.db
RutaDB=C:\lazarus\examples\std_actions\ColaCorreos.db

; Ruta del archivo de log.
; Vacío = <carpeta del exe>\relay.log
RutaLog=C:\proyectos\go\smtprelay\relay.log


[Log]
; Nivel de detalle del log:
   0 = Debug   (todo, incluye cada ciclo del worker; útil solo para depurar)
;   1 = Info    (eventos normales: arranque, encolado, envío)
;   2 = Warn    (solo advertencias y errores) <- recomendado en producción
;   3 = Error   (solo errores)
Nivel=0
[Web]
        Habilitado  = 1
        Puerto       = 8080
        Bind       = "0.0.0.0"
        Usuario    ="admin"
        Password   ="admin"